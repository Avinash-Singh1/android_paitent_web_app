<section class="critical-issues">
  <div class="critical-issues__wrapper">
    <h2>
      {{ "FROM_LITTLE_TO_CRITICAL_ISSUES" | translate }}
    </h2>
  </div>

  <!-- Skeleton loader while data loads -->
  <div class="critical-issues__carousel skeleton-row" style="margin-left: 7.5%" *ngIf="loading">
    <div class="d-flex gap-4">
      <div *ngFor="let s of [1,2,3,4,5,6,7]" class="skeleton-card">
        <div class="skeleton-card__circle shimmer"></div>
        <div class="skeleton-card__text shimmer"></div>
      </div>
    </div>
  </div>

  <div
    class="critical-issues__carousel fade-in"
    style="margin-left: 7.5%"
    *ngIf="isBrowser && !isMobileView && !loading"

  >
    <owl-carousel-o [options]="customOptions">
      <ng-container *ngFor="let slide of apiData; let i = index; trackBy: trackByIndex">
        <ng-template
          class="slide"
          carouselSlide
          [id]="slide.id + 'c'"
          [width]="cardWidth"
        >
          <div class="critical-issues__carousel__items">
            <div class="center">
              <div class="critical-issues__carousel__items__image">
                <!-- <div
                  class="profile-icon cursor-pointer"
                  *ngIf="!slide.image"
                  (click)="viewDoctor(slide?.name)"
                >
                  {{ slide?.name | nameInitial | uppercase }}
                </div> -->
                <a
                  class="profile-icon cursor-pointer"
                  *ngIf="!slide.image"
                  [routerLink]="['/delhi', commonService.replaceSpaceWithHyphen(slide?.name)]"
                  [title]="slide?.name"
                >
                  {{ slide?.name | nameInitial | uppercase }}
                </a>

                <!-- <img
                  class="cursor-pointer"
                  [src]="slide.image"
                  [alt]="slide?.name"
                  *ngIf="slide.image"
                  (click)="viewDoctor(slide?.name)"
                /> -->
                <a
                *ngIf="slide.image"
                [routerLink]="['/delhi', commonService.replaceSpaceWithHyphen(slide?.name)]"
                [title]=" slide?.name"
              >
                <!-- <img
                  class="cursor-pointer"
                  [src]="slide.image"
                  [alt]="slide?.name"
                /> -->
                  <img
                  class="cursor-pointer"
                  [src]="slide.image"
                  [alt]="slide?.name"
                  width="100"
                  height="100"
                  loading="lazy"
                />

              </a>

              </div>
            </div>
            <!-- <h2
              (click)="viewDoctor(slide?.name)"
              class="cursor-pointer line-clamp-2"
            >
              {{ slide?.name }}
            </h2> -->
            <a
            class="cursor-pointer line-clamp-2 text-center text-decoration-none text-black"
            [routerLink]="['/delhi', commonService.replaceSpaceWithHyphen(slide?.name)]"
            [title]="slide?.name"
          >
            {{ slide?.name }}
          </a>
          
          </div>
        </ng-template>
      </ng-container>
    </owl-carousel-o>
  </div>
  <div
    class="critical-issues__carousel fade-in"
    style="margin-left: 5%"
   *ngIf="isBrowser && isMobileView && !loading"

  >
    <owl-carousel-o [options]="customOptions">
      <ng-container *ngFor="let slide of apiData; let i = index; trackBy: trackByIndex">
        <ng-template
          class="slide"
          carouselSlide
          [id]="slide.id + 'c'"
          [width]="cardWidth"
        >
          <div class="d-flex flex-column gap-3">
            <div class="critical-issues__carousel__items" *ngIf="slide[0]">
              <div class="center">
                <div class="critical-issues__carousel__items__image">
                  <div
                    class="profile-icon"
                    *ngIf="!slide[0]?.image"
                    (click)="viewDoctor(slide[0]?.name)"
                  >
                    {{ slide[0]?.name | nameInitial | uppercase }}
                  </div>
                  <img
                    class=""
                    [src]="slide[0]?.image"
                    [alt]="slide[0]?.name"
                    *ngIf="slide[0]?.image"
                    (click)="viewDoctor(slide[0]?.name)"
                    width="80"
                    height="80"
                    loading="lazy"
                  />
                </div>
              </div>
              <h3 (click)="viewDoctor(slide[0]?.name)">
                {{ slide[0]?.name }}
              </h3>
            </div>

            <div class="critical-issues__carousel__items" *ngIf="slide[1]">
              <div class="center">
                <div class="critical-issues__carousel__items__image">
                  <div
                    class="profile-icon"
                    *ngIf="!slide[1]?.image"
                    (click)="viewDoctor(slide[1]?.name)"
                  >
                    {{ slide[1]?.name | nameInitial | uppercase }}
                  </div>
                  <img
                    class=""
                    [src]="slide[1]?.image"
                    [alt]="slide[1]?.name"
                    *ngIf="slide[1]?.image"
                    (click)="viewDoctor(slide[1]?.name)"
                    width="80"
                    height="80"
                    loading="lazy"
                  />
                </div>
              </div>
              <h3 (click)="viewDoctor(slide[1]?.name)">
                {{ slide[1]?.name }}
              </h3>
            </div>
          </div>
        </ng-template>
      </ng-container>
    </owl-carousel-o>
  </div>
</section>
