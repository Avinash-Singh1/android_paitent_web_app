<div class="vmed">
  <div class="vmed__wrapper">
    <!-- Header -->
    <div class="vmed__header">
      <div class="vmed__header-left">
        <button class="vmed__back" (click)="location.back()" type="button" aria-label="Go back">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
        </button>
        <div class="vmed__header-info">
          <span class="vmed__header-date">{{ detail?.date | date : "dd MMM YYYY" }}</span>
          <div class="vmed__header-meta">
            <span class="vmed__type-badge" *ngIf="detail?.type == 1">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
              Prescription
            </span>
            <span class="vmed__type-badge vmed__type-badge--report" *ngIf="detail?.type == 2">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
              Report
            </span>
            <span class="vmed__type-badge vmed__type-badge--invoice" *ngIf="detail?.type == 3">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
              Invoice
            </span>
            <span class="vmed__record-count">{{ records?.length }} Record{{ records?.length > 1 ? 's' : '' }} for <strong>{{ detail?.patientName | titlecase }}</strong></span>
          </div>
        </div>
      </div>
      <button class="vmed__add-btn" (click)="addMoreMedical()" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add More
      </button>
    </div>

    <!-- Records Grid -->
    <div class="vmed__grid">
      <ng-container *ngFor="let item of records">
        <div class="vmed__card">
          <!-- Card Header -->
          <div class="vmed__card-head">
            <span class="vmed__card-type" *ngIf="detail?.type == 1">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
              Prescription
            </span>
            <span class="vmed__card-type vmed__card-type--report" *ngIf="detail?.type == 2">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
              Report
            </span>
            <span class="vmed__card-type vmed__card-type--invoice" *ngIf="detail?.type == 3">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="5" width="20" height="14" rx="2"/><line x1="2" y1="10" x2="22" y2="10"/></svg>
              Invoice
            </span>
            <button class="vmed__card-menu" [matMenuTriggerFor]="menu" type="button" aria-label="More options">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/>
              </svg>
            </button>
            <mat-menu #menu="matMenu" class="vmed-menu">
              <button mat-menu-item (click)="openShareDialog(item)">
                <span class="vmed-menu__icon vmed-menu__icon--share">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
                </span>
                <span>Share</span>
              </button>
              <button mat-menu-item (click)="deleteRecord(item)">
                <span class="vmed-menu__icon vmed-menu__icon--delete">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
                </span>
                <span>Delete</span>
              </button>
            </mat-menu>
          </div>
          <!-- Card Preview -->
          <div class="vmed__card-preview" (click)="openBackdrop(item)">
            <img
              [src]="item?.url"
              alt="Medical record"
              *ngIf="!item.url.endsWith('pdf')"
              loading="lazy"
            />
            <div class="vmed__card-pdf" *ngIf="item.url.endsWith('pdf')">
              <iframe [src]="item?.url | sanitize | async" title="document"></iframe>
              <div class="vmed__card-overlay" (click)="openIframe($event, item)"></div>
            </div>
            <div class="vmed__card-hover">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/><line x1="11" y1="8" x2="11" y2="14"/><line x1="8" y1="11" x2="14" y2="11"/></svg>
              <span>View</span>
            </div>
          </div>
        </div>
      </ng-container>
    </div>

    <!-- Empty State -->
    <div class="vmed__empty" *ngIf="records && records.length === 0">
      <span class="vmed__empty-icon">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
        </svg>
      </span>
      <span class="vmed__empty-text">No Records Found</span>
      <span class="vmed__empty-sub">Add medical records to keep them organized</span>
    </div>
  </div>
</div>

<!-- Lightbox / Backdrop Viewer -->
<section *ngIf="backdropEnable" class="vmed-lightbox">
  <div class="vmed-lightbox__bar">
    <button class="vmed-lightbox__close" (click)="backdropEnable = !backdropEnable" type="button" aria-label="Close">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <span class="vmed-lightbox__title">
      <span *ngIf="detail?.type == 1">Prescription</span>
      <span *ngIf="detail?.type == 2">Report</span>
      <span *ngIf="detail?.type == 3">Invoice</span>
    </span>
    <button class="vmed-lightbox__download" (click)="download(selectedData?.url)" type="button">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
      Download
    </button>
  </div>
  <div class="vmed-lightbox__content">
    <img loading="lazy" [src]="selectedData?.url" alt="Medical record" *ngIf="dataType !== 'pdf'" />
    <iframe [src]="selectedData?.url | sanitize | async" *ngIf="dataType == 'pdf'" title="document"></iframe>
  </div>
</section>
