<section class="why-choose">
  <h2 class="why-choose__title">Why Choose Us for {{ treatmentTitle }}?</h2>

  <!-- Numbered cards -->
  <div class="why-choose__cards">
    <div class="why-choose__card" *ngFor="let item of whyChoose">
      <span class="why-choose__card-num">{{ item.num }}</span>
      <div class="why-choose__card-body">
        <h4 class="why-choose__card-title">{{ item.title }}</h4>
        <p class="why-choose__card-desc">{{ item.desc }}</p>
      </div>
    </div>
  </div>

  <!-- Post-operative care -->
  <h3 class="why-choose__sub-title">Post-Operative Care</h3>
  <div class="why-choose__postop">
    <div class="why-choose__postop-item" *ngFor="let care of postOpCare">
      <span class="why-choose__postop-icon">{{ care.icon }}</span>
      <h5 class="why-choose__postop-name">{{ care.title }}</h5>
      <p class="why-choose__postop-desc">{{ care.desc }}</p>
    </div>
  </div>

  <!-- CTA -->
  <div class="why-choose__cta">
    <p class="why-choose__cta-text">
      Speak to our expert surgeon for {{ treatmentTitle }}
    </p>
    <a [href]="'tel:' + phone" class="why-choose__cta-btn">
      📞 Call {{ phone }}
    </a>
  </div>
</section>
