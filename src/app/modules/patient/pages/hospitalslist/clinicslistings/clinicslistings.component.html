<section class="doctor-search-result">
  <div class="doctor-search-result__container">
    <h2>All Appointments</h2>

    <nav class="breadcrumb-nav" aria-label="Breadcrumb">
      <ol class="breadcrumb-list">
        <li class="breadcrumb-item">
          <a routerLink="/" class="breadcrumb-link">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Home</span>
          </a>
        </li>
        <li class="breadcrumb-item">
          <a class="breadcrumb-link" routerLink="/delhi/doctors">Delhi</a>
        </li>
        <li class="breadcrumb-item">
          <a class="breadcrumb-link" routerLink="/delhi/dentist">Dentist</a>
        </li>
        <li class="breadcrumb-item">
          <span class="breadcrumb-current" aria-current="page">Saket</span>
        </li>
      </ol>
    </nav>

     <div class="heading d-flex flex-column">
      <div class="heading-item">
        <h1>
          125 Best doctors for Dental service in Saket, Delhi, Delhi NCR
        </h1>
      </div>
      <div class="heading-description">
        <p>Book appointments quickly with verified doctors.</p>
      </div>
    </div>


        <div 
  class="doctor-search-result__container__cards"
  *ngIf="totalItems"
>
  <ul [ngClass]="{'fade-enter': fading}" class="page-content">
    <li
      *ngFor="
        let item of content
          | paginate: {
              itemsPerPage: payload.size,
              currentPage: payload.page,
              totalItems: totalItems
            }; let i = index; trackBy: trackByFn"
    >
      <nectar-calendar-view [data]="item" [index]="i"></nectar-calendar-view>
    </li>
  </ul>
</div>
</div>
</section>
