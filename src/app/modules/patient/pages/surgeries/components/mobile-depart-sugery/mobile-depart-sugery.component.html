<section class="mds">
  <div class="mds__inner">
    <!-- Header -->
    <div class="mds__header">
      <div>
        <h2 class="mds__title">{{ data?.name || 'General Surgery' }}</h2>
        <p class="mds__count">{{ totalCount || 0 }} ailments</p>
      </div>
      <button class="mds__close" (click)="bottomSheet.dismiss()" aria-label="Close">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>

    <!-- Surgery Grid -->
    <div class="mds__grid">
      <div class="mds__item" *ngFor="let i of surgeryList" (click)="viewSurgery(i)">
        <div class="mds__item-icon">
          <img loading="lazy" [src]="i?.imageUrl" [alt]="i?.title" />
        </div>
        <span class="mds__item-name">{{ i?.title | truncate:22 }}</span>
      </div>
    </div>
  </div>
</section>
