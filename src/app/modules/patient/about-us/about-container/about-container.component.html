<!-- ===== About Us – Container / Tab Navigation ===== -->
<div class="ab__hero">
  <div class="ab__hero-inner">
    <span class="ab__hero-badge">About Us</span>
    <h1 class="ab__hero-title">Redefining Healthcare<br/>for Everyone</h1>
    <p class="ab__hero-sub">Nectar+ Healthcare connects patients with verified doctors, hospitals &amp; clinics — making quality care accessible and affordable across India.</p>
  </div>
</div>

<nav class="ab__tabs" aria-label="About section tabs">
  <div class="ab__tabs-inner">
    <a class="ab__tabs-item"
       routerLink="about"
       routerLinkActive="ab__tabs-item--active"
       (click)="activeTab = 'about'">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z" fill="currentColor"/></svg>
      About Nectar
    </a>
    <a class="ab__tabs-item"
       routerLink="values"
       routerLinkActive="ab__tabs-item--active"
       (click)="activeTab = 'value'">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="currentColor"/></svg>
      Values
    </a>
    <a class="ab__tabs-item"
       routerLink="leadership"
       routerLinkActive="ab__tabs-item--active"
       (click)="activeTab = 'leadership'">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z" fill="currentColor"/></svg>
      Leadership
    </a>
  </div>
</nav>

<router-outlet></router-outlet>

<nectar-client-testimonials *ngIf="activeTab != 'leadership'"></nectar-client-testimonials>
<nectar-faq></nectar-faq>
