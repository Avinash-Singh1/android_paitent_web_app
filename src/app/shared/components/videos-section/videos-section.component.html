<section
  class="videos-wrapper"
  *ngIf="!(tab === 0 && !apiData.length)"
  [ngClass]="{ 'border-bottom-style': tab === 0, 'pt-6': tab === 0 }"
>
  <div class="videos-header">
    <h2 *ngIf="apiData.length && type !== 'doctor'">Latest Videos</h2>
    <h2 *ngIf="apiData.length && type === 'doctor'">Recent Videos</h2>
    <div class="videos-nav" *ngIf="apiData.length > 2">
      <button class="videos-nav__btn" (click)="scrollVideos('prev')" aria-label="Previous videos">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
      </button>
      <button class="videos-nav__btn" (click)="scrollVideos('next')" aria-label="Next videos">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"></polyline></svg>
      </button>
    </div>
  </div>

  <div class="videos" #videosTrack>
    <div *ngFor="let slide of apiData; let i = index" class="video-wrapper">

      <!-- Thumbnail view -->
      <div
        class="video-thumbnail"
        [style.backgroundImage]="'url(' + (slide?.url ? getThumbnail(slide.url) : '') + ')'"
        (click)="playVideo(i)"
        *ngIf="!iframeVisible[i]"
      >
        <div class="play-button"></div>
      </div>

      <!-- Iframe view -->
      <iframe
        *ngIf="iframeVisible[i] && slide?.url"
        width="100%"
        height="315"
        [src]="getEmbedUrl(slide.url)"
        title="YouTube video player"
        frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
        allowfullscreen
      ></iframe>

    </div>
  </div>

  <div class="noData" *ngIf="apiData.length < 1 && apiHit">
    <h2 class="text-danger text-18 text-center">No Videos Found</h2>
  </div>
</section>
