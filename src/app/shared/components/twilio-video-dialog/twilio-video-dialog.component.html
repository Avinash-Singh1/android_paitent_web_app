<div class="tvd">
  <!-- Header -->
  <header class="tvd__header">
    <div class="tvd__title">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="23 7 16 12 23 17 23 7"></polygon>
        <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
      </svg>
      <span>Video Consultation</span>
      <small class="tvd__count" *ngIf="!errorMessage && !connecting">
        {{ participantsCount }} in room
      </small>
    </div>
    <button class="tvd__close" (click)="leave()" title="Close" aria-label="Close">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </header>

  <!-- Body -->
  <div class="tvd__body">
    <!-- Fallback (non-Twilio provider) -->
    <ng-container *ngIf="!isTwilioSession">
      <div class="tvd__fallback">
        <h3>External video meeting</h3>
        <p>This appointment uses an external Google Meet link.</p>
        <button class="tvd__btn tvd__btn--primary" (click)="openMeetFallback()" [disabled]="!fallbackMeetUrl">
          Open Meet in new tab
        </button>
        <p class="tvd__hint" *ngIf="!fallbackMeetUrl">
          Meet link not available yet — please wait for the doctor to start.
        </p>
      </div>
    </ng-container>

    <!-- Twilio Video stage -->
    <ng-container *ngIf="isTwilioSession">
      <div class="tvd__stage">
        <div class="tvd__remote" #remoteContainer>
          <div class="tvd__placeholder" *ngIf="connecting && !errorMessage">
            <div class="tvd__spinner" aria-hidden="true"></div>
            <span>Connecting…</span>
          </div>
          <div class="tvd__placeholder tvd__placeholder--error" *ngIf="errorMessage">
            <strong>{{ errorMessage }}</strong>
            <button class="tvd__btn tvd__btn--secondary" *ngIf="fallbackMeetUrl" (click)="openMeetFallback()">
              Open Meet fallback
            </button>
          </div>
          <div class="tvd__placeholder" *ngIf="!connecting && !errorMessage && participantsCount <= 1">
            <span>Waiting for the other participant to join…</span>
          </div>
        </div>
        <div class="tvd__self" #selfContainer></div>
      </div>
    </ng-container>
  </div>

  <!-- Controls -->
  <footer class="tvd__controls" *ngIf="isTwilioSession && !errorMessage">
    <button class="tvd__ctrl" [class.tvd__ctrl--off]="muted" (click)="toggleMute()" title="Toggle microphone">
      <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22">
        <path *ngIf="!muted" d="M12 14a3 3 0 003-3V5a3 3 0 00-6 0v6a3 3 0 003 3zm5.91-3a5.91 5.91 0 01-11.82 0H4a8 8 0 007 7.93V22h2v-3.07A8 8 0 0020 11h-2.09z"/>
        <path *ngIf="muted" d="M19 11h-1.7c0 .74-.16 1.43-.43 2.05l1.23 1.23c.56-.98.9-2.09.9-3.28zM15 11.16L9 5.18V5a3 3 0 016 0v6.16zM4.27 3L3 4.27l6.01 6.01V11a3 3 0 004.61 2.53l1.74 1.74A5.9 5.9 0 0112 15c-3.26 0-5.91-2.65-5.91-5.91H4a8 8 0 007 7.93V22h2v-3.07a7.98 7.98 0 003.67-1.44L19.73 21 21 19.73 4.27 3z"/>
      </svg>
    </button>
    <button class="tvd__ctrl" [class.tvd__ctrl--off]="cameraOff" (click)="toggleCamera()" title="Toggle camera">
      <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22">
        <path *ngIf="!cameraOff" d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
        <path *ngIf="cameraOff" d="M21 6.5l-4 4V7c0-.55-.45-1-1-1H9.82L21 17.18V6.5zM3.27 2L2 3.27 4.73 6H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.21 0 .39-.08.54-.18L19.73 21 21 19.73 3.27 2z"/>
      </svg>
    </button>
    <button class="tvd__ctrl tvd__ctrl--leave" (click)="leave()" title="Leave call">
      <svg viewBox="0 0 24 24" fill="currentColor" width="22" height="22">
        <path d="M12 9c-1.6 0-3.15.25-4.6.72v3.1c0 .39-.23.74-.56.9-.98.49-1.87 1.12-2.66 1.85-.18.18-.43.28-.7.28a.996.996 0 01-.7-.29L.29 13.08a.965.965 0 01-.29-.7c0-.28.11-.53.29-.71C3.34 8.78 7.46 7 12 7s8.66 1.78 11.71 4.67c.18.18.29.43.29.71 0 .28-.11.53-.29.71l-2.48 2.48c-.18.18-.43.29-.7.29-.26 0-.52-.11-.7-.28a11.27 11.27 0 00-2.67-1.85.996.996 0 01-.56-.9v-3.1C15.15 9.25 13.6 9 12 9z"/>
      </svg>
    </button>
  </footer>
</div>
